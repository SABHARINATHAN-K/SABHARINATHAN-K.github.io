<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - CareerPath</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./dashboard.html">
        <span class="brand-mark">CP</span>
        <span class="gradient-text">CareerPath</span>
      </a>

      <nav class="topnav">
        <a class="nav-link" href="./dashboard.html">Dashboard</a>
        <a class="nav-link" href="./goals.html">Goals</a>
        <a class="nav-link" href="./analytics.html">Analytics</a>
        <a class="nav-link active" href="./profile.html">Profile</a>
      </nav>

      <button id="logoutBtn" class="btn btn-muted btn-small" type="button">Logout</button>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <section class="page-header">
        <div>
          <h1>My Profile</h1>
          <p>Manage your account information and preferences.</p>
        </div>

        <div class="toolbar-actions">
          <button id="editBtn" class="btn btn-primary" type="button">Edit Profile</button>
          <button id="cancelBtn" class="btn btn-muted hidden" type="button">Cancel</button>
          <button id="saveBtn" class="btn btn-secondary hidden" type="button">Save Changes</button>
        </div>
      </section>

      <section class="profile-layout">
        <aside class="profile-side">
          <div class="avatar-xl" id="profileInitial">U</div>
          <h2 style="text-align: center;" id="profileDisplayName">User</h2>
          <p style="text-align: center;" class="text-muted" id="profileDisplayEmail">-</p>
          <p style="text-align: center; margin-top: 0.35rem;" class="text-muted" id="joinedDateText">Joined recently</p>

          <div class="meta-list">
            <div class="meta-row"><span>Role</span><strong id="quickRole">-</strong></div>
            <div class="meta-row"><span>Career Track</span><strong id="quickTrack">-</strong></div>
          </div>
        </aside>

        <section class="profile-main">
          <form id="profileForm" class="form">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input id="fullName" type="text" required disabled />
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input id="email" type="email" disabled />
              <span class="field-help">Email cannot be changed.</span>
            </div>

            <div class="form-group">
              <label for="bio">Bio</label>
              <textarea id="bio" placeholder="Tell us about yourself..." disabled></textarea>
            </div>

            <div class="form-group">
              <label for="location">Location</label>
              <input id="location" type="text" placeholder="City, Country" disabled />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="role">Role</label>
                <select id="role" disabled></select>
              </div>

              <div class="form-group">
                <label for="careerTrack">Career Track</label>
                <select id="careerTrack" disabled></select>
              </div>
            </div>
          </form>
        </section>
      </section>

      <pre id="messageBox" class="message">Ready.</pre>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/profile.js"></script>
</body>
</html>
