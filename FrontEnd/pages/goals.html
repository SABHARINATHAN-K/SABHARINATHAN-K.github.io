<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goals - CareerPath</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./dashboard.html">
        <span class="brand-mark">CP</span>
        <span class="gradient-text">CareerPath</span>
      </a>

      <nav class="topnav">
        <a class="nav-link" href="./dashboard.html">Dashboard</a>
        <a class="nav-link active" href="./goals.html">Goals</a>
        <a class="nav-link" href="./analytics.html">Analytics</a>
        <a class="nav-link" href="./profile.html">Profile</a>
      </nav>

      <button id="logoutBtn" class="btn btn-muted btn-small" type="button">Logout</button>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <section class="page-header">
        <div>
          <h1>My Goals</h1>
          <p>Create, manage, and track your career objectives.</p>
        </div>
        <div class="toolbar-actions">
          <button id="toggleTemplatesBtn" class="btn btn-ghost" type="button">Templates</button>
          <button id="newGoalBtn" class="btn btn-primary" type="button">New Goal</button>
        </div>
      </section>

      <section id="templatesPanel" class="panel hidden">
        <div class="section-header">
          <h3>Goal Templates</h3>
          <button id="closeTemplatesBtn" class="btn btn-muted btn-small" type="button">Close</button>
        </div>
        <div class="form-group" style="max-width: 380px; margin-bottom: 0.7rem;">
          <label for="templateCareerTrack">Career Track</label>
          <select id="templateCareerTrack"></select>
        </div>
        <div id="templateButtons" class="template-list"></div>
      </section>

      <section class="panel">
        <div class="section-header">
          <h3>Filters</h3>
          <button id="clearFiltersBtn" class="btn btn-muted btn-small" type="button">Clear Filters</button>
        </div>

        <div class="filter-grid">
          <input id="searchInput" type="text" placeholder="Search goals by title or description" />
          <select id="statusFilter">
            <option value="ALL">All Status</option>
            <option value="PLANNED">Planned</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="COMPLETED">Completed</option>
          </select>
          <select id="priorityFilter">
            <option value="ALL">All Priorities</option>
          </select>
          <select id="categoryFilter">
            <option value="ALL">All Categories</option>
          </select>
          <button id="refreshBtn" class="btn btn-secondary" type="button">Refresh</button>
        </div>

        <p id="resultText" class="text-muted" style="margin-top: 0.6rem;">Showing 0 goals</p>
      </section>

      <section id="goalsGrid" class="goal-grid"></section>

      <pre id="messageBox" class="message">Ready.</pre>
    </div>
  </main>

  <div id="createModal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Create New Goal</h2>
        <button id="closeCreateModalBtn" class="btn btn-muted btn-small" type="button">Close</button>
      </div>

      <div class="modal-body">
        <form id="createForm" class="form">
          <div class="form-group">
            <label for="createTitle">Title *</label>
            <input id="createTitle" type="text" placeholder="Learn React Framework" required />
          </div>

          <div class="form-group">
            <label for="createDescription">Description</label>
            <textarea id="createDescription" placeholder="Describe your goal..."></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="createPriority">Priority</label>
              <select id="createPriority"></select>
            </div>

            <div class="form-group">
              <label for="createCategory">Category</label>
              <select id="createCategory"></select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="createTargetDate">Target Date</label>
              <input id="createTargetDate" type="date" />
            </div>

            <div class="form-group">
              <label for="createTags">Tags (comma separated)</label>
              <input id="createTags" type="text" placeholder="react, portfolio, interview" />
            </div>
          </div>

          <div class="toolbar-actions">
            <button id="cancelCreateBtn" class="btn btn-muted" type="button">Cancel</button>
            <button id="createBtn" class="btn btn-primary" type="submit">Create Goal</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/goals.js"></script>
</body>
</html>
