spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/career_planning_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:sabhari}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    ignore-migration-patterns: '*:4'

server:
  port: ${PORT:8080}

google:
  auth:
    client-id: ${GOOGLE_AUTH_CLIENT_ID:}
